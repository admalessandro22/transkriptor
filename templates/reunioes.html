{% extends "base.html" %}
{% block titulo %}Reuniões{% endblock %}
{% block conteudo %}
<div class="tk-page" id="pagina-reunioes">
  <div class="tk-page__inner">
    <div class="tk-page__cabecalho">
      <div>
        <h2 class="tk-page__titulo">Reuniões</h2>
        <p class="tk-subtle">Índice das reuniões processadas. Nenhuma fala aparece aqui; abra uma reunião no Assistente para consultar o conteúdo.</p>
      </div>
      <div class="tk-field tk-field--inline">
        <label for="busca-reunioes" class="tk-visually-hidden">Filtrar reuniões</label>
        <div class="tk-search"><svg class="tk-icon"><use href="{{ url_for('static', filename='icones.svg') }}#i-search"/></svg><input id="busca-reunioes" type="search" placeholder="Filtrar por data ou título" autocomplete="off"></div>
      </div>
    </div>
    <div class="tk-rows" id="lista-reunioes" aria-label="Reuniões processadas" aria-live="polite" hidden></div>
    <div id="lista-reunioes-estado" class="tk-empty" hidden></div>
    <div class="tk-page__acoes"><button type="button" class="tk-btn" id="carregar-mais" hidden>Carregar mais</button></div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="{{ url_for('static', filename='js/reunioes-pagina.js') }}"></script>{% endblock %}
